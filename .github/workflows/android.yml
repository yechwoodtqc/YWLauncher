name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run Android lint
        shell: bash
        run: |
          set +e
          gradle --no-daemon lintDebug
          status=$?
          echo "===== LINT TEXT REPORT ====="
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
          elif [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          else
            echo "No lint text report found."
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ywlauncher-build-diagnostics
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Publish latest YWLauncher release
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest YWLauncher
          body: Automatically built from the latest successful main-branch build.
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: app/build/outputs/apk/debug/*.apk

      - name: Add built APK to repository
        if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/YWLauncher.apk
          git add release/YWLauncher.apk
          if git diff --cached --quiet -- release/YWLauncher.apk; then
            echo "Repository APK is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update latest built YWLauncher APK"
            git push
          fi
